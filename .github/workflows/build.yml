name: Build CodeAssist

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح بتشغيل يدوي

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # مهم جداً، المشروع يستخدم submodules

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;30.0.3' # مثال، قد تحتاج لتحديث الإصدارات

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK (Full Build)
        run: ./gradlew :ide-android:assembleDebug # أو :assembleRelease للتوقيع

      - name: Upload APK (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssist-Debug-APK
          path: ide-android/build/outputs/apk/debug/*.apk

      - name: Run Core Tests (Optional)
        run: CI_CORE_ONLY=true ./gradlew check
